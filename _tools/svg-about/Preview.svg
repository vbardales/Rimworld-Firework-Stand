<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f38"/>
      <stop offset="1" stop-color="#161920"/>
    </linearGradient>

    <!-- The light thrown on the ground by a launch: the effect the mod adds, the stand being
     dark the rest of the time. -->
    <radialGradient id="glow">
      <stop offset="0" stop-color="#F5E6A8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F5E6A8" stop-opacity="0"/>
    </radialGradient>

    <!-- One ray of the burst: the stroke, then the spark at its tip. -->
    <g id="ray">
      <line x1="0" y1="-13" x2="0" y2="-52" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="-60" r="3.5" stroke="none"/>
    </g>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>

  <!-- Main burst -->
  <g transform="translate(320 168) scale(1.55)" stroke="#F5E6A8" fill="#F5E6A8">
    <use href="#ray" transform="rotate(0)"/>
    <use href="#ray" transform="rotate(22.5)"/>
    <use href="#ray" transform="rotate(45)"/>
    <use href="#ray" transform="rotate(67.5)"/>
    <use href="#ray" transform="rotate(90)"/>
    <use href="#ray" transform="rotate(112.5)"/>
    <use href="#ray" transform="rotate(135)"/>
    <use href="#ray" transform="rotate(157.5)"/>
    <use href="#ray" transform="rotate(180)"/>
    <use href="#ray" transform="rotate(202.5)"/>
    <use href="#ray" transform="rotate(225)"/>
    <use href="#ray" transform="rotate(247.5)"/>
    <use href="#ray" transform="rotate(270)"/>
    <use href="#ray" transform="rotate(292.5)"/>
    <use href="#ray" transform="rotate(315)"/>
    <use href="#ray" transform="rotate(337.5)"/>
    <circle cx="0" cy="0" r="7" stroke="none"/>
  </g>

  <!-- Two secondary bursts, further off and smaller -->
  <g transform="translate(168 122) scale(0.72)" stroke="#E0705F" fill="#E0705F" opacity="0.9">
    <use href="#ray" transform="rotate(0)"/>
    <use href="#ray" transform="rotate(45)"/>
    <use href="#ray" transform="rotate(90)"/>
    <use href="#ray" transform="rotate(135)"/>
    <use href="#ray" transform="rotate(180)"/>
    <use href="#ray" transform="rotate(225)"/>
    <use href="#ray" transform="rotate(270)"/>
    <use href="#ray" transform="rotate(315)"/>
    <circle cx="0" cy="0" r="5" stroke="none"/>
  </g>
  <g transform="translate(476 96) scale(0.55)" stroke="#C9A24B" fill="#C9A24B" opacity="0.8">
    <use href="#ray" transform="rotate(22.5)"/>
    <use href="#ray" transform="rotate(67.5)"/>
    <use href="#ray" transform="rotate(112.5)"/>
    <use href="#ray" transform="rotate(157.5)"/>
    <use href="#ray" transform="rotate(202.5)"/>
    <use href="#ray" transform="rotate(247.5)"/>
    <use href="#ray" transform="rotate(292.5)"/>
    <use href="#ray" transform="rotate(337.5)"/>
    <circle cx="0" cy="0" r="4" stroke="none"/>
  </g>

  <!-- Trails: from the muzzles up to the bursts -->
  <g fill="none" stroke="#C9A24B" stroke-width="2" stroke-linecap="round" opacity="0.45">
    <path d="M320 356 Q312 280 320 246"/>
    <path d="M296 362 Q236 268 178 178"/>
    <path d="M344 362 Q412 262 468 140"/>
  </g>

  <!-- The stand: frame, tubes, fuse smoke, light on the ground -->
  <g transform="translate(320 430)">
    <ellipse cx="0" cy="10" rx="128" ry="16" fill="url(#glow)"/>
    <ellipse cx="0" cy="12" rx="96" ry="9" fill="#000000" opacity="0.28"/>

    <!-- Legs -->
    <path d="M-84 -52 h13 l9 52 h-13 z" fill="#6B5238"/>
    <path d="M84 -52 h-13 l-9 52 h13 z" fill="#6B5238"/>
    <!-- Low crossbar and top rail -->
    <rect x="-72" y="-18" width="144" height="9" rx="3" fill="#5A452F"/>
    <rect x="-92" y="-58" width="184" height="14" rx="4" fill="#7A5E40"/>

    <!-- Tubes fanned out: the middle one has just fired -->
    <g transform="rotate(-15)">
      <rect x="-70" y="-124" width="21" height="72" rx="4" fill="#B4453C"/>
      <rect x="-70" y="-104" width="21" height="7" fill="#E6DCC6"/>
      <rect x="-70" y="-128" width="21" height="7" rx="2" fill="#3D4049"/>
    </g>
    <g transform="rotate(15)">
      <rect x="49" y="-124" width="21" height="72" rx="4" fill="#B4453C"/>
      <rect x="49" y="-104" width="21" height="7" fill="#E6DCC6"/>
      <rect x="49" y="-128" width="21" height="7" rx="2" fill="#3D4049"/>
    </g>
    <rect x="-11" y="-130" width="22" height="76" rx="4" fill="#C0574C"/>
    <rect x="-11" y="-108" width="22" height="7" fill="#F6EFE4"/>
    <rect x="-11" y="-134" width="22" height="7" rx="2" fill="#3D4049"/>
    <circle cx="0" cy="-134" r="15" fill="url(#glow)"/>

    <!-- Fuse smoke at the foot of the frame -->
    <g fill="#9AA0AC" opacity="0.28">
      <circle cx="-104" cy="-6" r="9"/>
      <circle cx="-114" cy="-20" r="7"/>
      <circle cx="-108" cy="-34" r="5"/>
    </g>
  </g>

  <text x="320" y="500" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="54" fill="#F6EFE4">Firework Stand</text>
  <text x="320" y="540" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="26" fill="#B7AE9E">Only while somebody is watching</text>

  <line x1="200" y1="572" x2="440" y2="572" stroke="#4a505c" stroke-width="2"/>
  <text x="320" y="606" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="22" fill="#8b93a1">RimWorld 1.6</text>
</svg>
