<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Firework Stand preview</title>
<style>
* { box-sizing:border-box; margin:0; padding:0 }
html,body { width:896px; height:504px; overflow:hidden; font-family:"Segoe UI",system-ui,sans-serif }
.art,.veil { position:absolute; inset:0; width:896px; height:504px }
.art { object-fit:cover }
.veil { background:radial-gradient(circle at 0% 0%,rgb(var(--veil-rgb) / .92) 0%,rgb(var(--veil-rgb) / .84) 43%,rgb(var(--veil-rgb) / 0) 85%) }
.copy { position:absolute; left:50px; top:54px; color:var(--inkPrimary); text-shadow:0 3px 10px rgba(0,0,0,.75) }
h1 { font-size:46px; font-weight:600; line-height:1.1; letter-spacing:0 }
.rule { width:58px; height:3px; margin:20px 0 16px; background:var(--accent) }
p { width:430px; font-size:21px; font-weight:400; line-height:1.45 }
.badge { position:absolute; top:0; right:0; width:80px; height:80px; background:var(--accent); clip-path:polygon(0 0,100% 0,100% 100%) }
.version { position:absolute; left:869px; top:27px; transform:translate(-50%,-50%) rotate(45deg); color:var(--badgeInk); font-size:26px; font-weight:700; line-height:1; text-shadow:none }
</style>
<img class="art" src="Preview.png" alt=""><div class="veil"></div>
<main class="copy"><h1>Firework Stand</h1><div class="rule"></div><p>Fireworks become real recreation, with a type of their own.</p></main>
<div class="badge"></div><span class="version"></span>
<script>
window.ready = (async () => {
 const palette=await (await fetch('preview-palette.json')).json();
 for(const [key,value] of Object.entries(palette)) document.documentElement.style.setProperty('--'+key,value);
 document.documentElement.style.setProperty('--veil-rgb',palette.veil.slice(1).match(/../g).map(v=>parseInt(v,16)).join(' '));
 const xml=new DOMParser().parseFromString(await (await fetch('../Mod/About/About.xml')).text(),'text/xml');
 const versions=[...xml.querySelectorAll('supportedVersions li')].map(n=>n.textContent.trim()).filter(v=>/^\d+\.\d+$/.test(v));
 versions.sort((a,b)=>{const x=a.split('.').map(Number),y=b.split('.').map(Number);return x[0]-y[0]||x[1]-y[1]});
 if(!versions.length) throw Error('No declared stable version');
 document.querySelector('.version').textContent=versions.at(-1);
 await document.fonts.ready; await document.querySelector('.art').decode();
})();
</script></html>
